<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>청주·세종 지역화폐 주유소 찾기</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIINfQkslO3RGp6rZ7rFQKGFJY3wW8lp5LI=" crossorigin="">
<style>
*{box-sizing:border-box} body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;margin:0;background:linear-gradient(135deg,#0f172a 0%,#1e293b 100%);color:#e2e8f0;min-height:100vh}
.wrap{max-width:900px;margin:0 auto;padding:16px}
.header{background:linear-gradient(135deg,#3b82f6,#6366f1);border-radius:20px;padding:24px;margin-bottom:16px;box-shadow:0 8px 32px rgba(59,130,246,.25)}
.header h1{margin:0;font-size:22px;font-weight:700;color:#fff;letter-spacing:-.5px}
.header .subtitle{font-size:13px;color:rgba(255,255,255,.75);margin-top:4px}
.controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;align-items:flex-end}
.btn{padding:10px 16px;border:none;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s}
.btn-loc{background:rgba(255,255,255,.2);color:#fff;backdrop-filter:blur(8px)} .btn-loc:hover{background:rgba(255,255,255,.3)}
.btn-loc.active{background:#fff;color:#3b82f6}
select,input[type=number]{padding:10px 14px;border:1px solid rgba(255,255,255,.15);border-radius:12px;background:rgba(255,255,255,.1);color:#fff;font-size:13px;-webkit-appearance:none;backdrop-filter:blur(8px)} select option{background:#1e293b;color:#fff}
input[type=number]::-webkit-inner-spin-button{opacity:1}
#status{font-size:13px;margin-top:12px;padding:8px 12px;border-radius:10px;background:rgba(255,255,255,.08)}
#status.ok{background:rgba(34,197,94,.15);color:#4ade80}
.err{color:#f87171;font-size:13px;margin-top:8px;padding:8px 12px;border-radius:10px;background:rgba(239,68,68,.1);white-space:pre-wrap}
.stats{font-size:11px;color:rgba(255,255,255,.45);margin-top:10px;letter-spacing:.2px}
.card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:18px;margin-bottom:10px;backdrop-filter:blur(12px);transition:all .2s} .card:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.15);transform:translateY(-1px)}
.card-top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.card-name{font-size:16px;font-weight:700;color:#f1f5f9}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:.3px}
.badge-yeomin{background:rgba(168,85,247,.2);color:#c084fc} .badge-cheongju{background:rgba(14,165,233,.2);color:#38bdf8}
.price{font-size:26px;font-weight:800;background:linear-gradient(135deg,#fbbf24,#f59e0b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin:4px 0 8px}
.price.empty{background:linear-gradient(135deg,#64748b,#475569);-webkit-background-clip:text;font-size:16px}
.card-meta{font-size:13px;color:#94a3b8;line-height:1.7}
.card-meta b{color:#cbd5e1}
.rank{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:8px;background:rgba(255,255,255,.08);font-size:11px;font-weight:700;color:#94a3b8;margin-right:4px}
.rank.top3{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#1e293b}
.net-gain{font-size:13px;color:#4ade80;margin-top:4px;font-weight:600}
.net-gain.negative{color:#f87171}
.navlinks{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.navlinks a{font-size:11px;padding:5px 10px;border-radius:8px;background:rgba(255,255,255,.06);color:#94a3b8;border:1px solid rgba(255,255,255,.06);text-decoration:none;transition:all .15s;font-weight:500} .navlinks a:hover{background:rgba(255,255,255,.12);color:#e2e8f0;border-color:rgba(255,255,255,.15)}
.empty-msg{text-align:center;padding:40px;color:#64748b;font-size:15px}
.opt-params{display:none;margin-top:12px;padding:12px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08)}
.opt-params.visible{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.opt-params label{font-size:11px;color:rgba(255,255,255,.5)}
.opt-params input[type=number]{width:90px}
.map-panel{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:18px;margin:0 0 14px;padding:12px;backdrop-filter:blur(12px)}
.map-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:10px;color:#cbd5e1;font-size:13px}
.map-head b{color:#f8fafc}.map-note{font-size:11px;color:#94a3b8;line-height:1.4}
#map{height:260px;border-radius:14px;overflow:hidden;background:#0f172a;border:1px solid rgba(255,255,255,.08)}
.map-panel.collapsed #map{display:none}.map-panel.collapsed .map-note{display:none}
.btn-map{background:rgba(15,23,42,.65);color:#e2e8f0;border:1px solid rgba(255,255,255,.12);padding:7px 10px;border-radius:10px;font-size:12px;font-weight:700;cursor:pointer}
.price-marker{min-width:56px;text-align:center;padding:5px 7px;border-radius:12px;border:2px solid rgba(255,255,255,.85);box-shadow:0 4px 14px rgba(0,0,0,.35);color:#0f172a;font-size:11px;font-weight:900;line-height:1.05;white-space:nowrap}
.price-marker.low{background:#4ade80}.price-marker.mid{background:#fbbf24}.price-marker.high{background:#fb7185}.price-marker.unknown{background:#94a3b8;color:#111827}
.price-marker .fuel{display:block;font-size:9px;font-weight:800;opacity:.75}.leaflet-popup-content{color:#0f172a;font-size:13px;line-height:1.45}.leaflet-popup-content b{font-size:14px}
</style><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script></head><body><div class="wrap">
<div class="header">
<h1>⛽ 청주·세종 지역화폐 주유소 찾기</h1>
<div class="subtitle">청주페이 · 세종 여민전 결제 가능 주유소 전용 · <a href="mailto:snail@snailnomad.com" style="color:#fbbf24;text-decoration:underline">제작자</a> <a href="mailto:snail@snailnomad.com" style="color:#fbbf24;font-size:16px">✉</a></div>
<div class="controls">
<button class="btn btn-loc" onclick="getMyLocation()">📍 현재 위치 가져오기</button>
<div style="display:flex;gap:12px;flex-wrap:wrap">
<div><div style="font-size:10px;color:rgba(255,255,255,.5);margin-bottom:3px">정렬 기준</div><select id="sortMode" onchange="onSortChange()"><option value="distance">거리순</option><option value="price">가격순</option><option value="optimal">최적주유</option></select></div>
<div><div style="font-size:10px;color:rgba(255,255,255,.5);margin-bottom:3px">지역화폐</div><select id="currencyFilter" onchange="render()"><option value="all">전체</option><option value="여민전">여민전</option><option value="청주페이">청주페이</option></select></div>
<div><div style="font-size:10px;color:rgba(255,255,255,.5);margin-bottom:3px">유종</div><select id="fuelFilter" onchange="render()"><option value="휘발유" selected>휘발유</option><option value="경유">경유</option><option value="고급휘발유">고급휘발유</option><option value="LPG">LPG</option><option value="미확인">미확인</option><option value="all">전체</option></select></div>
</div>
</div>
<div id="optParams" class="opt-params">
<div><label>연비 (km/L)</label><input type="number" id="efficiency" value="12" min="1" max="50" step="0.5" onchange="render()"></div>
<div><label>여민전 캐시백 (%)</label><input type="number" id="discYeomin" value="10" min="0" max="50" step="1" onchange="updateDiscount();render()"></div>
<div><label>청주페이 인센티브 (%)</label><input type="number" id="discCheongju" value="10" min="0" max="50" step="1" onchange="updateDiscount();render()"></div>
<div><label>주유 예산 (원)</label><input type="number" id="budget" value="50000" min="1000" step="10000" onchange="render()"></div><div style="display:flex;align-items:center;gap:6px;padding-bottom:8px"><input type="checkbox" id="includeUnknown" onchange="render()"><label for="includeUnknown">가격 미확인 포함</label></div>
</div>
<div id="status">현재 위치 가져오기 버튼을 어여 누르세요</div>
<div id="errorBox" class="err" style="display:none"></div>
<div class="stats" id="stats"></div>
</div>
<div class="map-panel" id="mapPanel">
  <div class="map-head"><div><b>가격 미니맵</b><div class="map-note">현재 필터와 같은 주유소만 표시해. 좌표가 확인된 항목만 지도에 나와.</div></div><button class="btn-map" onclick="toggleMap()" id="mapToggle">지도 접기</button></div>
  <div id="map"></div>
</div>
<div id="list"></div>
</div>
<script>
const rows=[];
const DISCOUNT={"여민전":0.10,"청주페이":0.10};
const FUEL_LABELS=['휘발유','경유','고급휘발유','LPG'];
let myLat=null,myLon=null,map=null,markerLayer=null,lastMapItems=[];
function haversine(a,b,c,d){const R=6371,dLat=(c-a)*Math.PI/180,dLon=(d-b)*Math.PI/180,x=Math.sin(dLat/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function setStatus(m,ok){const e=document.getElementById('status');e.className=ok?'ok':'';e.textContent=m}
function setError(m){const e=document.getElementById('errorBox');e.style.display=m?'block':'none';e.textContent=m||''}
function escapeHtml(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function validCoord(r){const lat=Number(r.latitude),lon=Number(r.longitude);return Number.isFinite(lat)&&Number.isFinite(lon)&&lat>=33&&lat<=39&&lon>=124&&lon<=132}
function updateDiscount(){DISCOUNT["여민전"]=parseFloat(document.getElementById('discYeomin').value)/100||0;DISCOUNT["청주페이"]=parseFloat(document.getElementById('discCheongju').value)/100||0}
function onSortChange(){const opt=document.getElementById('optParams');opt.className=document.getElementById('sortMode').value==='optimal'?'opt-params visible':'opt-params';render()}
async function getMyLocation(){setError('');const b=document.querySelector('.btn-loc');if(!navigator.geolocation){setError('geolocation 미지원 브라우저');return}b.textContent='📍 위치 확인 중...';b.classList.add('active');navigator.geolocation.getCurrentPosition(p=>{myLat=p.coords.latitude;myLon=p.coords.longitude;setStatus('📍 '+myLat.toFixed(5)+', '+myLon.toFixed(5),true);b.textContent='📍 위치 확보됨';render()},err=>{let m='위치 조회 실패\n';if(err.code===1)m+='권한 거부됨\nChrome 설정 > 권한 > 위치 허용';else if(err.code===2)m+='위치를 찾지 못함\nGPS 켜거나 창가에서 재시도';else if(err.code===3)m+='시간 초과\n네트워크 상태 확인';else m+='알 수 없는 오류';setError(m);b.textContent='📍 다시 시도';b.classList.remove('active')},{enableHighAccuracy:true,timeout:12000,maximumAge:60000})}
function navLinks(r){const lat=Number(r.latitude),lon=Number(r.longitude),n=r.station_name,a=r.address||r.station_name;if(!validCoord(r)){const q=encodeURIComponent(n+' '+a);return '<div class="navlinks"><a href="https://apis.openapi.sk.com/tmap/app/routes?appKey=&name='+q+'" target="_blank">티맵</a><a href="https://map.naver.com/p/search/'+q+'" target="_blank">네이버지도</a><a href="https://map.kakao.com/?q='+q+'" target="_blank">카카오맵</a><a href="https://www.google.com/maps/search/?api=1&query='+q+'" target="_blank">구글맵</a></div>'}const naver='nmap://search?query='+encodeURIComponent(n)+'&lat='+lat+'&lng='+lon+'&appname=gasfinder';const naverF='https://map.naver.com/p/search/'+encodeURIComponent(n);const kakao='https://map.kakao.com/link/to/'+encodeURIComponent(n)+','+lat+','+lon;const tmap='tmap://route?goalname='+encodeURIComponent(n)+'&goalx='+lon+'&goaly='+lat;const tmapF='https://apis.openapi.sk.com/tmap/app/route?goalX='+lon+'&goalY='+lat+'&goalName='+encodeURIComponent(n);const gmap='https://www.google.com/maps/search/?api=1&query='+lat+','+lon+'('+encodeURIComponent(n)+')';const geo='geo:0,0?q='+lat+','+lon+'('+encodeURIComponent(n)+')';return '<div class="navlinks"><a href="'+tmap+'" onclick="event.preventDefault();openApp(this.href,\''+tmapF+'\')">티맵</a><a href="'+naver+'" onclick="event.preventDefault();openApp(this.href,\''+naverF+'\')">네이버지도</a><a href="'+kakao+'" target="_blank">카카오맵</a><a href="'+gmap+'" target="_blank">구글맵</a><a href="'+geo+'">기타지도앱</a></div>'}
function openApp(dl,fb){var t=Date.now();window.location.href=dl;setTimeout(function(){if(Date.now()-t<2000)window.open(fb,'_blank')},500)}
function getFuelInfo(r,selectedFuel){const fp=r.fuel_prices||{};let fuel=selectedFuel==='all'?(r.fuel_type||'휘발유'):selectedFuel;let data=fp[fuel];if(!data&&fuel==='휘발유'&&r.gasoline_price_today)data={price_text:r.gasoline_price_today,price_num:r.price_num,updated_at_fmt:r.updated_at_fmt};if(!data&&selectedFuel==='all')data=fp[r.fuel_type]||fp['휘발유']||fp['경유']||fp['고급휘발유']||fp['LPG'];if(data)return {fuel:fuel,priceText:data.price_text||'',priceNum:data.price_num??null,updated:data.updated_at_fmt||r.updated_at_fmt||''};return {fuel:fuel,priceText:'',priceNum:null,updated:''}}
function updateStats(){const latest=rows.flatMap(r=>Object.values(r.fuel_prices||{}).map(p=>p.updated_at_fmt).filter(Boolean)).concat(rows.map(r=>r.updated_at_fmt).filter(Boolean)).sort().slice(-1)[0]||'-';const count=(c)=>rows.filter(r=>r.currency===c).length;const priced=(fuel)=>rows.filter(r=>getFuelInfo(r,fuel).priceNum!=null).length;document.getElementById('stats').innerHTML='업데이트 '+latest+'<br><br>여민전 '+count('여민전')+'건 · 청주페이 '+count('청주페이')+'건 · 휘발유 '+priced('휘발유')+'건 · 경유 '+priced('경유')+'건 · 고급휘발유 '+priced('고급휘발유')+'건 · LPG '+priced('LPG')+'건'}
function markerClass(price,items){if(price==null)return 'unknown';const vals=items.map(r=>r.displayPriceNum).filter(v=>v!=null).sort((a,b)=>a-b);if(!vals.length)return 'unknown';const low=vals[Math.floor(vals.length*.33)],high=vals[Math.floor(vals.length*.67)];return price<=low?'low':(price<=high?'mid':'high')}
function ensureMap(){if(map||typeof L==='undefined')return;map=L.map('map',{scrollWheelZoom:false});L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);markerLayer=L.layerGroup().addTo(map);map.setView([36.64,127.43],10)}
function renderMap(items){lastMapItems=items.filter(validCoord).slice(0,120);ensureMap();if(!map||!markerLayer)return;markerLayer.clearLayers();if(!lastMapItems.length)return;const bounds=[];lastMapItems.forEach(r=>{const lat=Number(r.latitude),lon=Number(r.longitude),cls=markerClass(r.displayPriceNum,lastMapItems),label=r.displayPriceNum!=null?String(r.displayPriceNum):'미확인';const icon=L.divIcon({className:'',html:'<div class="price-marker '+cls+'"><span class="fuel">'+escapeHtml(r.displayFuel)+'</span>'+escapeHtml(label)+'</div>',iconSize:[64,38],iconAnchor:[32,19]});const popup='<b>'+escapeHtml(r.station_name)+'</b><br>'+escapeHtml(r.displayFuel+' '+(r.displayPriceText||'가격 미확인'))+'<br>'+escapeHtml(r.address||'')+'<br>'+navLinks(r);L.marker([lat,lon],{icon}).bindPopup(popup).addTo(markerLayer);bounds.push([lat,lon])});if(myLat&&myLon){L.circleMarker([myLat,myLon],{radius:6,color:'#38bdf8',fillColor:'#38bdf8',fillOpacity:.8}).bindPopup('내 위치').addTo(markerLayer);bounds.push([myLat,myLon])}map.fitBounds(bounds,{padding:[26,26],maxZoom:13});setTimeout(()=>map.invalidateSize(),80)}
function toggleMap(){const p=document.getElementById('mapPanel'),b=document.getElementById('mapToggle');p.classList.toggle('collapsed');b.textContent=p.classList.contains('collapsed')?'지도 펼치기':'지도 접기';if(!p.classList.contains('collapsed'))setTimeout(()=>{ensureMap();renderMap(lastMapItems.length?lastMapItems:rows)},80)}
function render(){const sm=document.getElementById('sortMode').value,cf=document.getElementById('currencyFilter').value,ff=document.getElementById('fuelFilter').value;const eff=parseFloat(document.getElementById('efficiency').value)||12,budget=parseFloat(document.getElementById('budget').value)||50000;let items=rows.map(r=>({...r}));items.forEach(r=>{const info=getFuelInfo(r,ff);r.displayFuel=info.fuel;r.displayPriceText=info.priceText;r.displayPriceNum=info.priceNum;r.displayUpdated=info.updated;const lat=Number(r.latitude),lon=Number(r.longitude);r.distanceKm=(myLat!=null&&myLon!=null&&validCoord(r))?haversine(myLat,myLon,lat,lon):null});if(cf!=='all')items=items.filter(r=>r.currency===cf);if(ff!=='all'&&ff!=='미확인')items=items.filter(r=>r.displayPriceNum!=null||((r.fuel_type||'')===ff&&!r.fuel_prices?.[ff]));if(ff==='미확인')items=items.filter(r=>!FUEL_LABELS.some(f=>getFuelInfo(r,f).priceNum!=null));if(!document.getElementById('includeUnknown').checked)items=items.filter(r=>r.displayPriceNum!=null);items.forEach(r=>{if(r.displayPriceNum&&r.distanceKm!=null){const roundTrip=r.distanceKm*2,fuelUsed=roundTrip/eff,tripCost=fuelUsed*r.displayPriceNum,buyableL=Math.max(0,(budget-tripCost)/r.displayPriceNum);r.netGain=buyableL-fuelUsed;r.buyableL=buyableL;r.tripCost=tripCost}else{r.netGain=null;r.buyableL=null;r.tripCost=null}});if(sm==='distance')items.sort((a,b)=>(a.distanceKm??1e9)-(b.distanceKm??1e9)||((a.displayPriceNum??1e9)-(b.displayPriceNum??1e9)));else if(sm==='price')items.sort((a,b)=>(a.displayPriceNum??1e9)-(b.displayPriceNum??1e9)||((a.distanceKm??1e9)-(b.distanceKm??1e9)));else items.sort((a,b)=>(b.netGain??-1e9)-(a.netGain??-1e9));renderMap(items);if(!items.length){document.getElementById('list').innerHTML='<div class="empty-msg">결과가 없어</div>';return}document.getElementById('list').innerHTML=items.map((r,i)=>{const badge=r.currency==='여민전'?'badge-yeomin':'badge-cheongju',pclass=r.displayPriceText?'price':'price empty',ptext=r.displayPriceText?(r.displayFuel+' '+r.displayPriceText):'가격 미확인';let discountInfo='';if(r.displayPriceNum){const disc=DISCOUNT[r.currency]||0,effectivePrice=Math.round(r.displayPriceNum*(1-disc));discountInfo='<div style="font-size:12px;color:#94a3b8;margin-top:2px">'+r.currency+' '+Math.round(disc*100)+'% 할인 → 실제 <b style="color:#4ade80">'+effectivePrice+'원/L</b></div>'}const dist=r.distanceKm!=null?r.distanceKm.toFixed(1)+'km':'—',rank=i<3?'rank top3':'rank';let netInfo='';if(sm==='optimal'&&r.displayPriceNum&&r.distanceKm!=null){netInfo='<div class="net-gain">총주유량 '+r.buyableL.toFixed(2)+'L (왕복 '+r.tripCost.toFixed(0)+'원 사용)</div>'}const phoneText=r.phone?('<a href="tel:'+String(r.phone).replace(/[^0-9+]/g,'')+'" style="color:#cbd5e1;text-decoration:underline">'+escapeHtml(r.phone)+'</a>'):'-';const updatedText=r.displayUpdated?('유가업데이트 '+r.displayUpdated):'유가업데이트 -';return '<div class="card"><div class="card-top"><span class="'+rank+'">'+(i+1)+'</span><span class="card-name">'+escapeHtml(r.station_name)+'</span><span class="badge '+badge+'">'+escapeHtml(r.currency)+'</span></div><div class="'+pclass+'">'+escapeHtml(ptext)+'</div>'+discountInfo+'<div class="card-meta">거리 <b>'+dist+'</b> · '+escapeHtml(r.address)+'<br>'+phoneText+' · '+updatedText+'</div>'+netInfo+navLinks(r)+'</div>'}).join('')}
updateStats();render();
</script></body></html>
