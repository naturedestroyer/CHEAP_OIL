function haversine(a,b,c,d){const R=6371,dLat=(c-a)*Math.PI/180,dLon=(d-b)*Math.PI/180,x=Math.sin(dLat/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(x))}

function escapeHtml(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function validCoord(r){const lat=Number(r.latitude),lon=Number(r.longitude);return Number.isFinite(lat)&&Number.isFinite(lon)&&lat>=33&&lat<=39&&lon>=124&&lon<=132}

function navLinks(r){const lat=Number(r.latitude),lon=Number(r.longitude),n=r.station_name,a=r.address||r.station_name;if(!validCoord(r)){const q=encodeURIComponent(n+' '+a);return '<div class="navlinks"><a href="https://apis.openapi.sk.com/tmap/app/routes?appKey=&name='+q+'" target="_blank">티맵</a><a href="https://map.naver.com/p/search/'+q+'" target="_blank">네이버지도</a><a href="https://map.kakao.com/?q='+q+'" target="_blank">카카오맵</a><a href="https://www.google.com/maps/search/?api=1&query='+q+'" target="_blank">구글맵</a></div>'}const naver='nmap://search?query='+encodeURIComponent(n)+'&lat='+lat+'&lng='+lon+'&appname=gasfinder';const naverF='https://map.naver.com/p/search/'+encodeURIComponent(n);const kakao='https://map.kakao.com/link/to/'+encodeURIComponent(n)+','+lat+','+lon;const tmap='tmap://route?goalname='+encodeURIComponent(n)+'&goalx='+lon+'&goaly='+lat;const tmapF='https://apis.openapi.sk.com/tmap/app/route?goalX='+lon+'&goalY='+lat+'&goalName='+encodeURIComponent(n);const gmap='https://www.google.com/maps/search/?api=1&query='+lat+','+lon+'('+encodeURIComponent(n)+')';const geo='geo:0,0?q='+lat+','+lon+'('+encodeURIComponent(n)+')';return '<div class="navlinks"><a href="'+tmap+'" onclick="event.preventDefault();openApp(this.href,\''+tmapF+'\')">티맵</a><a href="'+naver+'" onclick="event.preventDefault();openApp(this.href,\''+naverF+'\')">네이버지도</a><a href="'+kakao+'" target="_blank">카카오맵</a><a href="'+gmap+'" target="_blank">구글맵</a><a href="'+geo+'">기타지도앱</a></div>'}
function openApp(dl,fb){var t=Date.now();window.location.href=dl;setTimeout(function(){if(Date.now()-t<2000)window.open(fb,'_blank')},500)}
function getFuelInfo(r,selectedFuel){
const fp=r.fuel_prices||{};
const hasFp=Object.keys(fp).length>0;
let fuel=selectedFuel==='all'?(r.fuel_type||'휘발유'):selectedFuel;
let data=fp[fuel];
if(selectedFuel==='all'&&!data){
  fuel=FUEL_LABELS.find(f=>fp[f]&&fp[f].price_num!=null)||r.fuel_type||'휘발유';
  data=fp[fuel];
}
const rowFuel=r.fuel_type||'휘발유';
if(!data&&fuel==='휘발유'&&!hasFp&&rowFuel==='휘발유'&&r.gasoline_price_today){
  data={price_text:r.gasoline_price_today,price_num:r.price_num,updated_at_fmt:r.updated_at_fmt};
}
if(data)return {fuel:fuel,priceText:data.price_text||'',priceNum:data.price_num??null,updated:data.updated_at_fmt||r.updated_at_fmt||''};
return {fuel:fuel,priceText:'',priceNum:null,updated:''}
}

function render(){const sm=document.getElementById('sortMode').value,cf=document.getElementById('currencyFilter').value,ff=document.getElementById('fuelFilter').value;const eff=parseFloat(document.getElementById('efficiency').value)||12,budget=parseFloat(document.getElementById('budget').value)||50000;let items=rows.map(r=>({...r}));items.forEach(r=>{const info=getFuelInfo(r,ff);r.displayFuel=info.fuel;r.displayPriceText=info.priceText;r.displayPriceNum=info.priceNum;r.displayUpdated=info.updated;const lat=Number(r.latitude),lon=Number(r.longitude);r.distanceKm=(myLat!=null&&myLon!=null&&validCoord(r))?haversine(myLat,myLon,lat,lon):null});if(cf!=='all')items=items.filter(r=>r.currency===cf);if(ff!=='all'&&ff!=='미확인')items=items.filter(r=>r.displayPriceNum!=null||((r.fuel_type||'')===ff&&!r.fuel_prices?.[ff]));if(ff==='미확인')items=items.filter(r=>!FUEL_LABELS.some(f=>getFuelInfo(r,f).priceNum!=null));if(!document.getElementById('includeUnknown').checked)items=items.filter(r=>r.displayPriceNum!=null);items.forEach(r=>{if(r.displayPriceNum&&r.distanceKm!=null){const roundTrip=r.distanceKm*2,fuelUsed=roundTrip/eff,tripCost=fuelUsed*r.displayPriceNum,buyableL=Math.max(0,(budget-tripCost)/r.displayPriceNum);r.netGain=buyableL-fuelUsed;r.buyableL=buyableL;r.tripCost=tripCost}else{r.netGain=null;r.buyableL=null;r.tripCost=null}});if(sm==='distance')items.sort((a,b)=>(a.distanceKm??1e9)-(b.distanceKm??1e9)||((a.displayPriceNum??1e9)-(b.displayPriceNum??1e9)));else if(sm==='price')items.sort((a,b)=>(a.displayPriceNum??1e9)-(b.displayPriceNum??1e9)||((a.distanceKm??1e9)-(b.distanceKm??1e9)));else items.sort((a,b)=>(b.netGain??-1e9)-(a.netGain??-1e9));if(!items.length){document.getElementById('list').innerHTML='<div class="empty-msg">결과가 없어</div>';return}document.getElementById('list').innerHTML=items.map((r,i)=>{const badge=r.currency==='여민전'?'badge-yeomin':'badge-cheongju',pclass=r.displayPriceText?'price':'price empty',ptext=r.displayPriceText?(r.displayFuel+' '+r.displayPriceText):'가격 미확인';let discountInfo='';if(r.displayPriceNum){const disc=DISCOUNT[r.currency]||0,effectivePrice=Math.round(r.displayPriceNum*(1-disc));discountInfo='<div style="font-size:12px;color:#94a3b8;margin-top:2px">'+r.currency+' '+Math.round(disc*100)+'% 할인 → 실제 <b style="color:#4ade80">'+effectivePrice+'원/L</b></div>'}const dist=r.distanceKm!=null?r.distanceKm.toFixed(1)+'km':'—',rank=i<3?'rank top3':'rank';let netInfo='';if(sm==='optimal'&&r.displayPriceNum&&r.distanceKm!=null){netInfo='<div class="net-gain">총주유량 '+r.buyableL.toFixed(2)+'L (왕복 '+r.tripCost.toFixed(0)+'원 사용)</div>'}const phoneText=r.phone?('<a href="tel:'+String(r.phone).replace(/[^0-9+]/g,'')+'" style="color:#cbd5e1;text-decoration:underline">'+escapeHtml(r.phone)+'</a>'):'-';const updatedText=r.displayUpdated?('유가업데이트 '+r.displayUpdated):'유가업데이트 -';return '<div class="card"><div class="card-top"><span class="'+rank+'">'+(i+1)+'</span><span class="card-name">'+escapeHtml(r.station_name)+'</span><span class="badge '+badge+'">'+escapeHtml(r.currency)+'</span></div><div class="'+pclass+'">'+escapeHtml(ptext)+'</div>'+discountInfo+'<div class="card-meta">거리 <b>'+dist+'</b> · '+escapeHtml(r.address)+'<br>'+phoneText+' · '+updatedText+'</div>'+netInfo+navLinks(r)+'</div>'}).join('')}
